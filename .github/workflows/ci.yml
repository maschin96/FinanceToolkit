name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.11.23'
          enable-cache: false
      - name: Install locked environment
        run: uv sync --locked --extra plots --python '${{ matrix.python-version }}'
      - name: Tests
        run: uv run --no-sync python -m pytest
      - name: Offline examples and diagrams
        run: uv run --no-sync python -m finance_toolkit.examples --paths 100 --output /tmp/finance-demo --plot
      - name: Lint
        run: uv run --no-sync python -m ruff check .
      - name: Formatting
        run: uv run --no-sync python -m ruff format --check .
      - name: Types
        run: uv run --no-sync python -m mypy src/finance_toolkit
      - name: Whitespace
        run: git diff --check
      - name: Build distribution
        run: uv build
      - name: Install wheel in fresh environment and test outside source tree
        shell: bash
        run: |
          uv venv /tmp/finance-wheel --python '${{ matrix.python-version }}'
          uv export --locked --all-extras --no-emit-project --output-file /tmp/finance-runtime.txt
          uv pip install --python /tmp/finance-wheel/bin/python --require-hashes -r /tmp/finance-runtime.txt
          uv pip install --python /tmp/finance-wheel/bin/python --no-deps dist/*.whl
          cp -R tests /tmp/finance-wheel-tests
          cd /tmp
          /tmp/finance-wheel/bin/python -m pytest finance-wheel-tests
