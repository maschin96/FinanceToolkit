[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "finance-toolkit"
version = "0.0.1"
description = "Equity, options, bonds and portfolio analysis toolbox"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=2.2,<3", "scipy>=1.15,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/finance_toolkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers -ra --import-mode=importlib"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src/finance_toolkit"]
